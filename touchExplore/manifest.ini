name = touchExplore
summary = "Touch Explore Sounds"
description = "Adds VoiceOver-style sound feedback when touch-exploring (short earcons, different for buttons, links, edit fields and check boxes, panned left or right by position), moves real focus/selection to the touched item (including via flick navigation), supports split-tap activation, adds touch gestures for stopping speech, toggling speech, scrolling, media play/pause and speech rate, silences repeated container announcements, lets gesture recognition be tuned in millimetres or calibrated to your own touch, and adds a trackpad-as-touchscreen mode (NVDA+Ctrl+Shift+T) for machines with no touchscreen."
author = "sound <soun.chess@gmail.com>"
url = ""
version = "0.8.0"
minimumNVDAVersion = "2023.1"
lastTestedNVDAVersion = "2026.2"
