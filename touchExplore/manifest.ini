name = touchExplore
summary = "Touch Explore Sounds"
description = "Adds VoiceOver-style sound feedback when touch-exploring items on screen and when activating them, moves real focus/selection to the touched item (including via flick navigation), supports split-tap activation (hold one finger, tap with a second to activate), fixes misdetected multi-finger taps, silences repeated container/panel announcements (e.g. 'N items') when your finger is over empty space between icons, and adds a trackpad-as-touchscreen mode (NVDA+Ctrl+Shift+T) that lets a laptop trackpad's own multi-touch surface be used with real touch gestures on machines with no touchscreen."
author = "sound <soun.chess@gmail.com>"
url = ""
version = "0.7.0"
minimumNVDAVersion = "2023.1"
lastTestedNVDAVersion = "2026.2"
